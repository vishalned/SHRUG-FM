[flood]
results_path = "signal_task/results/flood"
[flood.dataloader]
train_test_split_file = "train_test_split_from_csv.json"
windows_file = "/data/worldfloods/window_file.json"
input_folder = "S2"
target_folder = "gt"
img_size = 256
target_size = 256
batch_size = 1
num_workers = 8
bootstrapping = false
filter_windows_version = "v2"
filter_windows_threshold = 0.1
filter_windows_apply = true
download = false
channel_configuration = "all"
normalize_train = true
normalize_test = true
model_input_size = 224
add_mndwi_input = false
[flood.model]
input_dim = 13
output_dim = 2
[flood.train]
lr = 5e-5
weight_decay = 5e-6
num_epochs = 50
loss = 'dice'
